<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Hovira — Your private AI household intelligence system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.5" stop-color="#0b1122"/>
      <stop offset="1" stop-color="#0f1430"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.88" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glowL)"/>
  <rect width="1280" height="360" fill="url(#glowR)"/>

  <!-- bottom accent line -->
  <rect x="0" y="356" width="1280" height="4" fill="url(#acc)"/>

  <rect x="972" y="40" width="262" height="34" rx="17" fill="url(#acc)" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.25"/>
  <text x="1103" y="62" text-anchor="middle" fill="#a5f3fc" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="12.5" letter-spacing="1.6" font-weight="600">PRIVATE · LOCAL · AI BY DESIGN</text>

  <!-- logo mark -->
  <g>
    <rect x="84" y="132" width="80" height="80" rx="20" fill="url(#acc)"/>
    <g stroke="#0a1120" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M106,182 v-28 l22,-20 l22,20 v28 z"/>
      <path d="M117,182 v-15 h22 v15"/>
    </g>
  </g>

  <text x="196" y="180" fill="url(#titleGrad)" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="0.5">Hovira</text>
  <text x="198" y="222" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="26">Your private AI household intelligence system</text>

  <!-- household graph motif nodes -->
  <g stroke="#22d3ee" stroke-width="1.3" fill="none" opacity="0.85">
    <line x1="580" y1="300" x2="720" y2="300"/>
    <line x1="720" y1="300" x2="860" y2="300"/>
    <line x1="720" y1="300" x2="720" y2="180"/>
    <line x1="720" y1="180" x2="580" y2="180"/>
    <line x1="720" y1="180" x2="860" y2="180"/>
    <line x1="580" y1="180" x2="580" y2="300"/>
    <line x1="860" y1="180" x2="860" y2="300"/>
  </g>
  <!-- nodes -->
  <circle cx="580" cy="180" r="11" fill="#0b1122" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="720" cy="180" r="17" fill="url(#acc)" fill-opacity="0.9"/>
  <circle cx="860" cy="180" r="11" fill="#0b1122" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="580" cy="300" r="11" fill="#0b1122" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="720" cy="300" r="11" fill="#0b1122" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="860" cy="300" r="11" fill="#0b1122" stroke="#22d3ee" stroke-width="2"/>

  <!-- node labels -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="15" fill="#cbd5e1">
    <text x="620" y="184">Products</text>
    <text x="752" y="180">ASK</text>
    <text x="798" y="184">Papers</text>
    <text x="600" y="304">Rooms</text>
    <text x="752" y="304">Events</text>
    <text x="798" y="304">Memory</text>
  </g>

  <!-- decorative particles -->
  <g opacity="0.6">
    <circle cx="1040" cy="140" r="5" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <circle cx="1160" cy="200" r="6" fill="#22d3ee" fill-opacity="0.5" stroke="#22d3ee" stroke-width="1.4"/>
    <circle cx="1105" cy="290" r="4" fill="none" stroke="#8b5cf6" stroke-width="1.4"/>
    <circle cx="1210" cy="120" r="4" fill="#8b5cf6" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.4"/>
    <circle cx="608" cy="330" r="4" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
    <circle cx="868" cy="330" r="4" fill="#8b5cf6" fill-opacity="0.5" stroke="#8b5cf6" stroke-width="1.3"/>
    <circle cx="1240" cy="280" r="7" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <circle cx="1010" cy="250" r="3" fill="#22d3ee" fill-opacity="0.5"/>
    <circle cx="1270" cy="180" r="3" fill="#8b5cf6" fill-opacity="0.5"/>
  </g>
</svg>
